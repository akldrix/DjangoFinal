{% extends "shopapp/base.html" %}

{% block title %}
Create an order
{% endblock title %}

{% block body %}
<h1>Order creation</h1>
<div>
  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Create</button>

  </form>
</div>
<div>
  <a href="{% url 'shopapp:order_list' %}">Back to order list</a>
</div>
{% endblock body %}
