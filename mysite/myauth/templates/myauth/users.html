{% extends "myauth/base.html" %}

{% block title %}
Users List
{% endblock title %}

{% block body %}
<h1>Users: </h1>
<div>
  {% if users %}
  <ul>
    {% for user in users %}

    <li>
      {% if user.profile.avatar %}
      <img src="{{ user.profile.avatar.url }}" alt=" {{ user.username }}-avatar" style="max-height: 20px;">
      {% endif %}

      <a href="{% url 'myauth:user-detail' pk=user.pk %}">{{ user.username }}</a>

    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No users yet</p>

  {% endif %}

  {% endblock body %}
